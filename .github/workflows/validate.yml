name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate manifest
        run: ./tests/validate-manifest.sh
      - name: Run ShellCheck
        run: shellcheck scripts/list-folders scripts/launch-agent tests/test-scripts.sh tests/validate-manifest.sh
      - name: Run script tests
        run: ./tests/test-scripts.sh
